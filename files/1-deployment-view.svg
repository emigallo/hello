<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-label="Prepedidos - Deployment view">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #E8E7E2; }
    .t-title { font-size: 14px; font-weight: bold; }
    .t-normal { font-size: 12px; }
    .t-package { font-size: 12px; font-weight: bold; }
    .t-edge { font-size: 11px; fill: #B8B6B0; }
    .box { fill: none; stroke: #E8E7E2; stroke-width: 1; }
    .arrow { stroke: #B8B6B0; stroke-width: 1; fill: none; }
    .arrow-dashed { stroke: #B8B6B0; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8B6B0"/>
    </marker>
  </defs>

  <text class="t-title" x="450" y="30" text-anchor="middle">Prepedidos - Deployment</text>

  <!-- ROW 1: Android device -->
  <path class="box" d="M 360 60 L 500 60 L 510 50 L 520 60 L 520 130 L 360 130 Z" />
  <text class="t-package" x="440" y="80" text-anchor="middle">Android device</text>
  <rect class="box" x="380" y="90" width="120" height="30" rx="4"/>
  <text class="t-normal" x="440" y="110" text-anchor="middle">field dispatch</text>
  <rect class="box" x="485" y="85" width="12" height="14"/>
  <line x1="481" y1="88" x2="491" y2="88" stroke="#E8E7E2" stroke-width="1"/>
  <line x1="481" y1="93" x2="491" y2="93" stroke="#E8E7E2" stroke-width="1"/>

  <line class="arrow" x1="440" y1="130" x2="440" y2="215" marker-end="url(#arr)"/>
  <text class="t-edge" x="450" y="175">HTTPS</text>

  <!-- ROW 2: Windows PC, Web server, Scheduled tasks -->
  <path class="box" d="M 60 220 L 260 220 L 270 210 L 280 220 L 280 300 L 60 300 Z" />
  <text class="t-package" x="170" y="240" text-anchor="middle">Windows PC</text>
  <rect class="box" x="90" y="255" width="160" height="30" rx="4"/>
  <text class="t-normal" x="170" y="275" text-anchor="middle">desktop client</text>
  <rect class="box" x="235" y="250" width="12" height="14"/>
  <line x1="231" y1="253" x2="241" y2="253" stroke="#E8E7E2" stroke-width="1"/>
  <line x1="231" y1="258" x2="241" y2="258" stroke="#E8E7E2" stroke-width="1"/>

  <path class="box" d="M 340 220 L 540 220 L 550 210 L 560 220 L 560 300 L 340 300 Z" />
  <text class="t-package" x="450" y="240" text-anchor="middle">Web server</text>
  <rect class="box" x="370" y="255" width="160" height="30" rx="4"/>
  <text class="t-normal" x="450" y="275" text-anchor="middle">business API</text>
  <rect class="box" x="515" y="250" width="12" height="14"/>
  <line x1="511" y1="253" x2="521" y2="253" stroke="#E8E7E2" stroke-width="1"/>
  <line x1="511" y1="258" x2="521" y2="258" stroke="#E8E7E2" stroke-width="1"/>

  <path class="box" d="M 620 220 L 820 220 L 830 210 L 840 220 L 840 300 L 620 300 Z" />
  <text class="t-package" x="730" y="240" text-anchor="middle">Scheduled tasks server</text>
  <rect class="box" x="650" y="255" width="160" height="30" rx="4"/>
  <text class="t-normal" x="730" y="275" text-anchor="middle">synchronizations</text>
  <rect class="box" x="795" y="250" width="12" height="14"/>
  <line x1="791" y1="253" x2="801" y2="253" stroke="#E8E7E2" stroke-width="1"/>
  <line x1="791" y1="258" x2="801" y2="258" stroke="#E8E7E2" stroke-width="1"/>

  <!-- ROW 3: External services (cloud), shared business core, SQL Server, ERP bridge -->
  <path class="box" d="M 60 470 Q 30 470 30 490 Q 20 500 30 515 Q 25 535 50 535 Q 55 555 80 555 L 200 555 Q 225 555 230 535 Q 250 530 240 510 Q 250 495 235 485 Q 235 465 210 465 Q 195 455 175 465 Q 155 455 140 465 Q 120 455 100 465 Q 75 460 60 470 Z"/>
  <text class="t-normal" x="135" y="505" text-anchor="middle">Messaging, maps,</text>
  <text class="t-normal" x="135" y="520" text-anchor="middle">mail and AI</text>

  <rect class="box" x="290" y="470" width="180" height="70" rx="4"/>
  <text class="t-normal" x="380" y="510" text-anchor="middle">shared business core</text>
  <rect class="box" x="450" y="465" width="12" height="14"/>
  <line x1="446" y1="468" x2="456" y2="468" stroke="#E8E7E2" stroke-width="1"/>
  <line x1="446" y1="473" x2="456" y2="473" stroke="#E8E7E2" stroke-width="1"/>

  <path class="box" d="M 510 460 L 700 460 L 710 450 L 720 460 L 720 560 L 510 560 Z" />
  <text class="t-package" x="615" y="480" text-anchor="middle">SQL Server engine</text>
  <ellipse class="box" cx="615" cy="510" rx="70" ry="10"/>
  <path class="box" d="M 545 510 L 545 540 Q 545 550 615 550 Q 685 550 685 540 L 685 510"/>
  <ellipse class="box" cx="615" cy="510" rx="70" ry="10"/>
  <text class="t-normal" x="615" y="535" text-anchor="middle">Principal database</text>

  <path class="box" d="M 750 460 L 870 460 L 880 450 L 890 460 L 890 560 L 750 560 Z" />
  <text class="t-package" x="820" y="480" text-anchor="middle">Web server</text>
  <rect class="box" x="765" y="500" width="110" height="30" rx="4"/>
  <text class="t-normal" x="820" y="520" text-anchor="middle">ERP bridge</text>
  <rect class="box" x="860" y="495" width="12" height="14"/>
  <line x1="856" y1="498" x2="866" y2="498" stroke="#E8E7E2" stroke-width="1"/>
  <line x1="856" y1="503" x2="866" y2="503" stroke="#E8E7E2" stroke-width="1"/>

  <!-- Arrows from row 2 to row 3 -->
  <path class="arrow" d="M 130 300 Q 100 380 130 465" marker-end="url(#arr)"/>
  <text class="t-edge" x="60" y="380">HTTPS</text>

  <path class="arrow-dashed" d="M 200 300 Q 260 380 340 470" marker-end="url(#arr)"/>
  <text class="t-edge" x="230" y="380">uses</text>

  <path class="arrow" d="M 250 300 Q 420 380 570 460" marker-end="url(#arr)"/>
  <text class="t-edge" x="410" y="380">HTTPS</text>

  <path class="arrow-dashed" d="M 420 300 Q 400 380 380 470" marker-end="url(#arr)"/>
  <text class="t-edge" x="380" y="380">uses</text>

  <path class="arrow" d="M 480 300 Q 560 380 630 460" marker-end="url(#arr)"/>
  <text class="t-edge" x="565" y="380">HTTPS</text>

  <path class="arrow" d="M 540 300 Q 680 380 800 460" marker-end="url(#arr)"/>
  <text class="t-edge" x="700" y="380">HTTPS</text>

  <path class="arrow-dashed" d="M 660 300 Q 550 380 430 470" marker-end="url(#arr)"/>
  <text class="t-edge" x="510" y="380">uses</text>

  <path class="arrow" d="M 700 300 Q 680 380 660 460" marker-end="url(#arr)"/>
  <text class="t-edge" x="705" y="380">HTTPS</text>

  <path class="arrow" d="M 770 300 Q 800 380 820 460" marker-end="url(#arr)"/>
  <text class="t-edge" x="815" y="380">HTTPS</text>

  <!-- SAP -->
  <rect class="box" x="770" y="620" width="100" height="60" rx="4"/>
  <text class="t-normal" x="820" y="655" text-anchor="middle">SAP</text>

  <line class="arrow" x1="820" y1="560" x2="820" y2="620" marker-end="url(#arr)"/>
</svg>
